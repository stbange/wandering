name: Build and verify Wandering Castle
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libgl1-mesa-dev libegl1-mesa-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: cmake --install build --config Release --prefix dist/native
      - uses: actions/upload-artifact@v4
        with:
          name: wandering-${{ runner.os }}
          path: dist/native
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install gcovr
      - run: cmake -S . -B build-test -DWC_BUILD_GAME=OFF -DWC_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build-test --parallel 4
      - run: ctest --test-dir build-test --output-on-failure
      - run: mkdir -p artifacts && gcovr --root . --filter src/core --fail-under-line 95 --html-details artifacts/coverage.html --json-summary artifacts/coverage-summary.json --txt - build-test
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence
          path: artifacts
  web:
    # Playwright 1.56.1 supports Ubuntu 24.04; ubuntu-latest can advance past it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.22
          actions-cache-folder: emsdk-cache
      - run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DWC_WEBXR=ON
      - run: cmake --build build-web --parallel 4
      - name: Build standard browser edition
        run: |
          emcmake cmake -S . -B build-web-standard -DCMAKE_BUILD_TYPE=Release -DWC_WEBXR=OFF
          cmake --build build-web-standard --parallel 4
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Run delivered game journeys and input checks
        run: |
          python3 tools/stage_pages.py --web build-web-standard --webxr build-web --output build-pages/wandering
          python3 -m http.server 8088 --directory build-pages > /tmp/wandering-http.log 2>&1 &
          WC_PAGES_URL=http://127.0.0.1:8088/wandering/ node tests/pages.mjs
          WC_URL=http://127.0.0.1:8088/wandering/webxr/?seed=42 node tests/input.mjs
          WC_URL=http://127.0.0.1:8088/wandering/?seed=42 node tests/game.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-game-and-evidence
          path: |
            build-web/wandering.html
            build-web/wandering.js
            build-web/wandering.wasm
            build-web/LICENSE
            build-web/README.md
            build-web/assets
            build-web/docs
            build-web/openspec
            build-pages/wandering
            artifacts
      - name: Upload both GitHub Pages editions
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-pages/wandering
  pages:
    name: Publish separate web and WebXR pages
    needs: [native, coverage, web]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy both editions
        id: deployment
        uses: actions/deploy-pages@v4
